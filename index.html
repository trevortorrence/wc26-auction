const FB='https://wc26-auction-default-rtdb.firebaseio.com/wc26-auction-v1.json';

function loadFB(){
  return new Promise(function(resolve){
    var xhr=new XMLHttpRequest();
    xhr.open('GET',FB,true);
    xhr.timeout=5000;
    xhr.onload=function(){
      try{
        var d=JSON.parse(xhr.responseText);
        if(d&&d.phase&&Array.isArray(d.players)){
          // Firebase strips empty arrays/objects — restore defaults
          d.players=d.players.map(function(p){return Object.assign({teams:[]},p);});
          d.soldTeams=d.soldTeams||{};
          d.currentLot=d.currentLot||null;
          d.matches=d.matches||[];
          d.bonusPicks=d.bonusPicks||{};
          d.bonusAnswers=d.bonusAnswers||{};
          d.bonusLocked=d.bonusLocked||{};
          resolve(d);
        }else{console.warn('Bad state shape');resolve(null);}
      }catch(e){console.error('Parse error',e);resolve(null);}
    };
    xhr.onerror=function(){console.error('XHR error');resolve(null);};
    xhr.ontimeout=function(){console.warn('XHR timeout');resolve(null);};
    xhr.send();
  });
}

function saveFB(s,cb){
  var xhr=new XMLHttpRequest();
  xhr.open('PUT',FB,true);
  xhr.onload=function(){
    if(xhr.status>=200&&xhr.status<300){if(cb)cb(null);}
    else{console.error('Save failed:',xhr.status);if(cb)cb(new Error('HTTP '+xhr.status));}
  };
  xhr.onerror=function(){console.error('Save network error');if(cb)cb(new Error('network'));};
  xhr.send(JSON.stringify(s));
}

function calcBonusPts(playerName,bonusPicks,bonusAnswers){
  var picks=(bonusPicks||{})[playerName]||{};
  var total=0;
  for(var i=0;i<BONUS_QUESTIONS.length;i++){
    var q=BONUS_QUESTIONS[i];
    var ans=(picks[q.id]||'').toLowerCase().trim();
    var correct=((bonusAnswers||{})[q.id]||'').toLowerCase().trim();
    if(ans&&correct&&ans===correct) total+=q.pts;
  }
  return total;
}

function calcPts(players,matches){
  var pts={};
  for(var i=0;i<players.length;i++) pts[players[i].name]=0;
  for(var m=0;m<matches.length;m++){
    var match=matches[m];
    var s1=parseInt(match.score1),s2=parseInt(match.score2);
    if(isNaN(s1)||isNaN(s2)) continue;
    var sp=STAGE_PTS[match.stage]||2;
    for(var p=0;p<players.length;p++){
      var pl=players[p],o1=false,o2=false;
      for(var t=0;t<pl.teams.length;t++){
        if(pl.teams[t].name===match.team1) o1=true;
        if(pl.teams[t].name===match.team2) o2=true;
      }
      if(o1){if(s1>s2)pts[pl.name]+=sp;else if(s1===s2&&match.stage==='group')pts[pl.name]+=1;}
      if(o2){if(s2>s1)pts[pl.name]+=sp;else if(s1===s2&&match.stage==='group')pts[pl.name]+=1;}
    }
  }
  return pts;
}

    {name:"Nora",     teams:[{name:"Senegal",price:16},{name:"Mexico",price:20},{name:"Iraq",price:5}]}

    var price=parseInt(bid);
    var pi=-1;for(var i=0;i<p.players.length;i++){if(p.players[i].name===sel){pi=i;break;}}

    var rem=TPP-pl.teams.length;

    p.onSell(p.lot.name,pi,price);setSel('');setBid('');setErr('');
  }
  return html`<div style=${{...S.card({padding:0}),border:'2px solid '+C.gold,overflow:'hidden'}}>

function getLastResult(player,matches){
  for(var i=matches.length-1;i>=0;i--){
    var m=matches[i];
    var o1=false,o2=false;
    for(var j=0;j<player.teams.length;j++){
      if(player.teams[j].name===m.team1) o1=true;
      if(player.teams[j].name===m.team2) o2=true;
    }
    if(!o1&&!o2) continue;
    var s1=parseInt(m.score1),s2=parseInt(m.score2);
    var sp=STAGE_PTS[m.stage]||2;
    var myTeam=o1?m.team1:m.team2;
    var mine=o1?s1:s2,opp=o1?s2:s1;
    var oppTeam=o1?m.team2:m.team1;
    var earned=mine>opp?sp:(mine===opp&&m.stage==='group'?1:0);
    var stageLabel=STAGES.find(function(s){return s.id===m.stage;});
    return {myTeam:myTeam,oppTeam:oppTeam,mine:mine,opp:opp,earned:earned,stage:stageLabel?stageLabel.label:m.stage,result:mine>opp?'W':mine===opp?'D':'L'};
  }
  return null;
}

  var _r=useState(false),rfsh=_r[0],setRfsh=_r[1];
  var _m=useState(null),modal=_m[0],setModal=_m[1];
  function doRefresh(){setRfsh(true);p.onRef();setTimeout(function(){setRfsh(false);},600);}

        var teamPool=TEAMS.slice(0,39).sort(function(){return Math.random()-0.5;});
        var newPlayers=state.players.map(function(p,i){
          var myTeams=teamPool.slice(i*TPP,(i+1)*TPP).map(function(t){return{name:t.name,price:Math.floor(Math.random()*40)+5};});
          return Object.assign({},p,{teams:myTeams,budget:0});
        });
        var sold={};
        newPlayers.forEach(function(p){p.teams.forEach(function(t){sold[t.name]={playerIndex:newPlayers.indexOf(p),price:t.price};});});
        persist(Object.assign({},state,{phase:'tournament',players:newPlayers,soldTeams:sold,matches:[]}));
      }}/>`;  }
  if(state.phase==='auction'){
    if(isC){
      return html`<${CommView} state=${state}
        onNom=${function(t){persist(Object.assign({},state,{currentLot:t}));}}
        onSell=${function(nm,pi,pr){
          var np=state.players.map(function(pl,i){return i!==pi?pl:Object.assign({},pl,{budget:pl.budget-pr,teams:pl.teams.concat([{name:nm,price:pr}])});});
          var ns=Object.assign({},state.soldTeams);ns[nm]={playerIndex:pi,price:pr};
          var tot=Object.keys(ns).length;
          persist(Object.assign({},state,{players:np,soldTeams:ns,currentLot:null,nomIndex:state.nomIndex+1,phase:tot>=TOTAL?'tournament':'auction',matches:state.matches||[]}));
        }}
        onClear=${function(){persist(Object.assign({},state,{currentLot:null}));}}
        onReset=${function(){persist(INIT);}}/>`;
    }
    return html`<${PartView} state=${state} viewer=${viewer} onRef=${refresh}/>`;
  }
  if(state.phase==='tournament'){
    if(isC&&managing){
      return html`<${ResultsView} state=${state}
        onBack=${function(){setManaging(false);}}
        onSave=${function(matches){persist(Object.assign({},state,{matches:matches}));setManaging(false);}}/>`;
    }
    if(isC&&bonusAdmin){
      return html`<${BonusAdminScreen} state=${state}
        onBack=${function(){setBonusAdmin(false);}}
        onSave=${function(locked,answers){persist(Object.assign({},state,{bonusLocked:locked,bonusAnswers:answers}));}}/>`;
    }
    if(view==='bonus'){
      var effectiveViewer=isC?commPlayer:viewer;
      return html`<${BonusPicksScreen} state=${state} viewer=${effectiveViewer} isC=${isC}
        onView=${setView}
        onBonusAdmin=${function(){setBonusAdmin(true);}}
        onSetCommPlayer=${function(n){setCommPlayer(n);localStorage.setItem('wc26-commplayer',n);}}
        onSave=${function(newPicks,cb){persist(Object.assign({},state,{bonusPicks:newPicks}));if(cb)cb();}}/>`;
    }
    return html`<${Leaderboard} state=${state} isC=${isC} viewer=${viewer}
      view=${view} onSwitchView=${setView}
      onManage=${function(){setManaging(true);}}
      onRef=${refresh}/>`;
  }
  if(state.phase==='complete')return html`<${Done} state=${state}/>`;
  return null;
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
document.getElementById('status-msg').textContent='FETCHING DATA...';

loadFB().then(function(s){
  document.getElementById('status').style.display='none';
  var init=s||INIT;
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(App,{init:init})
  );
}).catch(function(e){
  document.getElementById('status-msg').textContent='ERROR: '+e.message;
});

// Hard safety: if nothing renders in 6 seconds, show setup anyway
setTimeout(function(){
  if(document.getElementById('root').children.length===0){
    document.getElementById('status').style.display='none';
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(App,{init:INIT})
    );
  }
},6000);

})();
</script>
